# Builds the portable Windows version of OcuSense and keeps it as a downloadable
# workflow artifact (not a public release). It only runs when started by hand:
# GitHub › Actions › "Windows build (manual)" › Run workflow. See docs/windows.md.
name: Windows build (manual)

on:
  workflow_dispatch:

permissions:
  contents: read  # read the code; nothing is published, released or pushed

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"  # the same Python as the Mac build
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Connect accounts (only when the repository variables are set)
        if: ${{ vars.SUPABASE_URL != '' && vars.SUPABASE_PUBLISHABLE_KEY != '' }}
        shell: python
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          import json, os
          url, key = os.environ["SUPABASE_URL"].strip().rstrip("/"), os.environ["SUPABASE_PUBLISHABLE_KEY"].strip()
          if key.startswith("sb_secret_"):
              raise SystemExit("Use the publishable key, never the secret one.")
          with open("ocusense/supabase.json", "w") as f:
              json.dump({"url": url, "publishable_key": key}, f)
          print("Accounts connected to", url)

      - name: Build the portable app and run its self-test
        run: python packaging/build_windows.py

      - name: Keep the zip as a workflow artifact (14 days)
        uses: actions/upload-artifact@v4
        with:
          name: OcuSense-windows-x64
          path: dist/OcuSense-windows-x64.zip
          retention-days: 14
          if-no-files-found: error

      - name: Unit tests on Windows (no camera; offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          OCUSENSE_NO_NOTIFICATIONS: "1"
        run: python -m unittest discover -s tests
