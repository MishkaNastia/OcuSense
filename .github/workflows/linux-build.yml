# Builds the portable Linux version of OcuSense (beta) and keeps it as a downloadable
# workflow artifact (not a public release). Only runs when started by hand:
# GitHub › Actions › "Linux build (manual)" › Run workflow.
name: Linux build (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04  # older glibc, so the build runs on more Linux versions
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: System libraries for Qt and OpenCV
        run: >-
          sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libgles2 libgbm1 libglib2.0-0
          libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libxcb-cursor0 libxcb-xinerama0

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Connect accounts (only when the repository variables are set)
        if: ${{ vars.SUPABASE_URL != '' && vars.SUPABASE_PUBLISHABLE_KEY != '' }}
        shell: python
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          import json, os
          url, key = os.environ["SUPABASE_URL"].strip().rstrip("/"), os.environ["SUPABASE_PUBLISHABLE_KEY"].strip()
          if key.startswith("sb_secret_"):
              raise SystemExit("Use the publishable key, never the secret one.")
          with open("ocusense/supabase.json", "w") as f:
              json.dump({"url": url, "publishable_key": key}, f)

      - name: Build the portable app and run its self-test
        run: python packaging/build_linux.py

      - name: Keep the archive as a workflow artifact (14 days)
        uses: actions/upload-artifact@v4
        with:
          name: OcuSense-linux-x64
          path: dist/OcuSense-linux-x64.tar.gz
          retention-days: 14
          if-no-files-found: error

      - name: Unit tests on Linux (no camera; offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          OCUSENSE_NO_NOTIFICATIONS: "1"
        run: python -m unittest discover -s tests
